name: e2e-windows

# Validación completa de la cadena PowerShell en un runner real de Windows:
# setup desatendido -> smoke -> empaquetado offline -> instalación del paquete
# en otra carpeta. Se ejecuta manualmente (workflow_dispatch) y una vez por
# semana; el resto del tiempo la cadena sigue validándose en host físico.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  # Instalación base sin módulos: lo que usa un contexto que no compila C.
  solo-base:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # -SinImagen: valida la instalación componente por componente; cadena-completa usa la
      # imagen del último release, si existe.
      - name: Instalación desatendida de la base (sin módulos ni imagen)
        timeout-minutes: 20
        shell: pwsh
        run: ./setup.ps1 -Yes -SinImagen -Modulos ninguno

      - name: La base trae git (MinGit), uv y Python con las dependencias de Ripley, sin compilador ni VS Code
        timeout-minutes: 5
        shell: pwsh
        run: |
          Import-Module ./lib/env.common.psm1 -Force
          $null = Set-PortableSession -PortableRoot (Get-Location).Path
          foreach ($archivo in @("bin/uv.exe", "python/ACTUAL", "mingit/cmd/git.exe", ".install_complete", ".msys_complete")) {
            if (-not (Test-Path $archivo)) { throw "Falta $archivo en la instalacion base" }
          }
          foreach ($archivo in @(".compiladores_complete", ".vscode_complete", "vscode/Code.exe", "msys64/ucrt64/bin/gcc.exe", "msys64/usr/bin/git.exe")) {
            if (Test-Path $archivo) { throw "La base no deberia instalar $archivo" }
          }
          & ./msys64/usr/bin/bash.exe --login -c 'set -e; uv --version; python3 --version; python3 -c "import typer, rich"; ripley --help >/dev/null; case "$(command -v git)" in */mingit/cmd/git*) ;; *) echo "git no es el de MinGit: $(command -v git)"; exit 1;; esac; test "$(git -c alias.prueba="!echo shell-ok" prueba)" = shell-ok'
          if ($LASTEXITCODE -ne 0) { throw "La consola de la base no encuentra uv, Python, Ripley o el git de MinGit (con alias de shell)" }

      - name: Módulo de compiladores instalado después
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./modulos/compiladores.ps1 -SinImagen
          if (-not (Test-Path ".compiladores_complete")) { throw "El modulo de compiladores no dejo su marcador" }

      - name: Logs de diagnóstico ante fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-solo-base
          path: |
            install.log
            modulo-compiladores.log
          if-no-files-found: ignore

  cadena-completa:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Instalación desatendida del entorno
        timeout-minutes: 45
        shell: pwsh
        run: ./setup.ps1 -Yes

      - name: Pruebas de aceptación automatizadas (smoke)
        timeout-minutes: 15
        shell: pwsh
        run: ./herramientas/smoke.ps1

      - name: Empaquetado offline compacto
        timeout-minutes: 20
        shell: pwsh
        run: ./herramientas/package-env.ps1 -Compact

      # -Yes: sin consola interactiva la pausa final de install-offline.ps1 esperaba
      # una tecla indefinidamente y el job agotaba el límite de 2h30.
      - name: Roundtrip de instalación del paquete en otra carpeta
        timeout-minutes: 15
        shell: pwsh
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "instalacion-offline"
          ./install-offline.ps1 -RutaZip (Join-Path (Get-Location) "portable-env-offline.zip") -Destino $destino -Yes
          if ($LASTEXITCODE -ne 0) { throw "install-offline.ps1 termino con codigo $LASTEXITCODE" }
          # package-env.ps1 empaqueta todo bajo la carpeta raiz "entorno"
          $raiz = Join-Path $destino "entorno"
          foreach ($esperado in @("launch.bat", "setup.ps1", "msys64")) {
            if (-not (Test-Path (Join-Path $raiz $esperado))) {
              Get-ChildItem $destino -Depth 1 | Format-Table -AutoSize
              throw "El paquete instalado no contiene entorno\$esperado"
            }
          }

      - name: Logs de diagnóstico ante fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-diagnostico
          path: |
            install.log
            diagnose.log
          if-no-files-found: ignore
